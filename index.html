<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>分数から小数 練習</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --ink: #202633;
      --muted: #667085;
      --panel: #ffffff;
      --line: #d9dee8;
      --primary: #276ef1;
      --primary-dark: #1857c6;
      --good: #14845d;
      --bad: #c24134;
      --warm: #f6b44b;
      --cool: #58b3c9;
      --soft-green: #ddf3e9;
      --soft-red: #ffe2dd;
      --soft-gray: #eef1f6;
      --shadow: 0 12px 28px rgba(30, 36, 48, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #eef5ff 0, transparent 32rem), var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(1120px, calc(100% - 24px));
      margin: 0 auto;
      padding: 10px 0 28px;
    }

    header {
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.25rem, 1rem + 0.8vw, 1.75rem);
      font-weight: 700;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      min-height: 40px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      touch-action: manipulation;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: #aab4c4;
    }

    button:active {
      transform: translateY(0);
    }

    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    button.primary:hover {
      background: var(--primary-dark);
    }

    button.ghost {
      background: transparent;
    }

    button[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: white;
    }

    .app {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .practice {
      padding: 16px;
    }

    .visual-zone {
      display: grid;
      grid-template-columns: minmax(180px, 290px) minmax(0, 1fr);
      gap: 18px;
      align-items: center;
    }

    .picture-wrap {
      display: grid;
      justify-items: center;
      gap: 8px;
    }

    .fraction-visual {
      width: min(270px, 100%);
      height: auto;
      display: block;
    }

    .fraction-text {
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
    }

    .bar {
      display: grid;
      width: 100%;
      grid-template-columns: repeat(var(--parts), minmax(0, 1fr));
      gap: 3px;
    }

    .bar span {
      height: 18px;
      border-radius: 5px;
      background: var(--soft-gray);
      border: 1px solid var(--line);
    }

    .bar span.on {
      background: var(--cool);
      border-color: var(--cool);
    }

    .question h2 {
      margin: 0 0 8px;
      font-size: clamp(1.25rem, 1.04rem + 0.75vw, 1.8rem);
      font-weight: 700;
    }

    .hint {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.95rem;
    }

    .answer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      margin-bottom: 10px;
    }

    .answer-box {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .answer-prefix {
      display: grid;
      place-items: center;
      align-self: stretch;
      min-width: 74px;
      padding: 0 14px;
      background: var(--soft-gray);
      border-right: 1px solid var(--line);
      color: var(--muted);
      font-size: 1.85rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .answer-entry {
      position: relative;
      min-width: 0;
    }

    .answer-row input {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      padding: 12px 14px;
      font-size: 1.9rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: transparent;
      caret-color: transparent;
    }

    .answer-display {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 12px 14px;
      pointer-events: none;
      font-size: 1.9rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .answer-row input:focus,
    .answer-box:focus-within {
      outline: 3px solid rgba(39, 110, 241, 0.18);
      border-color: var(--primary);
    }

    .keypad {
      display: grid;
      gap: 7px;
      margin: 8px 0 10px;
    }

    .digit-pairs {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 5px;
    }

    .digit-stack {
      display: grid;
      gap: 5px;
    }

    .key {
      min-width: 0;
      min-height: 46px;
      padding: 9px 2px;
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
    }

    .key.dotdigit {
      min-height: 46px;
      padding: 9px 2px;
    }

    .key.placeholder {
      visibility: hidden;
      pointer-events: none;
    }

    .repeat-digit {
      position: relative;
      display: inline-block;
      min-width: 0.8em;
      padding-top: 0.28em;
      line-height: 1;
    }

    .repeat-digit::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 0.22em;
      height: 0.22em;
      border-radius: 50%;
      background: var(--primary);
      transform: translateX(-50%);
    }

    .key-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }

    .feedback {
      min-height: 50px;
      border-radius: 8px;
      padding: 10px 12px;
      background: #f2f4f7;
      color: var(--muted);
      line-height: 1.5;
    }

    .feedback.good {
      color: var(--good);
      background: var(--soft-green);
    }

    .feedback.bad {
      color: var(--bad);
      background: var(--soft-red);
    }

    .feedback .repeat-digit-answer,
    .answer-display .repeat-digit-answer {
      position: relative;
      display: inline-block;
      min-width: 0.72em;
      padding-top: 0.28em;
      line-height: 1;
      text-align: center;
    }

    .feedback .repeat-digit-answer::before,
    .answer-display .repeat-digit-answer::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 0.22em;
      height: 0.22em;
      border-radius: 50%;
      background: currentColor;
      transform: translateX(-50%);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
      transform: none;
    }

    .reaction {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      opacity: 0;
      z-index: 20;
    }

    .reaction.show {
      opacity: 1;
    }

    .big-circle {
      width: min(280px, 64vw);
      aspect-ratio: 1;
      border: 18px solid #e33a2f;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.72);
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    label {
      color: var(--muted);
      line-height: 1.45;
    }

    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      background: var(--panel);
      color: var(--ink);
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    .table th,
    .table td {
      text-align: left;
      padding: 9px 4px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    .table th:last-child,
    .table td:last-child {
      text-align: right;
    }

    .table th {
      color: var(--muted);
      font-weight: 600;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 0.86rem;
      background: var(--soft-gray);
      color: var(--muted);
    }

    .pill.good {
      background: var(--soft-green);
      color: var(--good);
    }

    .pill.bad {
      background: var(--soft-red);
      color: var(--bad);
    }

    .mini-list {
      display: grid;
      gap: 8px;
    }

    .mini-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }

    .mini-card:last-child {
      border-bottom: 0;
    }

    .tiny-visual {
      width: 36px;
      height: 36px;
    }

    @media (max-width: 900px) {
      .app,
      .visual-zone {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      main {
        width: min(100% - 18px, 1120px);
        padding-top: 14px;
      }

      .practice {
        padding: 12px;
      }

    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>分数から小数</h1>
    </header>

    <section class="app">
      <div class="panel practice">
        <div id="practiceView">
          <div class="visual-zone">
            <div class="picture-wrap">
              <svg id="fractionVisual" class="fraction-visual" viewBox="0 0 240 220" role="img" aria-label="分数の絵"></svg>
              <div id="fractionText" class="fraction-text">1/3</div>
              <div id="fractionBar" class="bar" aria-hidden="true"></div>
            </div>
            <div class="question">
              <h2 id="promptText">小数にすると？</h2>
              <p id="hintText" class="hint">0. の後ろだけ入力してね。例: 25</p>
              <form id="answerForm">
                <div class="answer-row">
                  <div class="answer-box">
                    <span class="answer-prefix" aria-hidden="true">0.</span>
                    <div class="answer-entry">
                      <input id="answerInput" inputmode="none" autocomplete="off" placeholder="" aria-label="0. の後ろの数字" readonly>
                      <div id="answerDisplay" class="answer-display" aria-hidden="true"></div>
                    </div>
                  </div>
                  <button class="primary" type="submit">答える</button>
                </div>
              </form>

              <div class="keypad" aria-label="タッチ入力">
                <div id="digitKeys" class="digit-pairs"></div>
                <div class="key-tools">
                  <button class="key" type="button" data-action="back">1つ消す</button>
                  <button class="key" type="button" data-action="clear">全部消す</button>
                </div>
              </div>

              <div id="feedback" class="feedback" aria-live="polite">絵の色がついた部分を、小数で表してみよう。</div>
              <div class="actions">
                <button id="nextCard" type="button">次へ</button>
              </div>
            </div>
          </div>
        </div>

        <div id="allView" hidden>
          <table class="table">
            <thead>
              <tr>
                <th>分数</th>
                <th>小数</th>
                <th>状態</th>
              </tr>
            </thead>
            <tbody id="allTable"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="correctReaction" class="reaction" aria-hidden="true">
    <div class="big-circle"></div>
  </div>

  <script>
    const allCards = [];
    for (let den = 3; den <= 9; den += 1) {
      for (let num = 1; num < den; num += 1) {
        if (den === 7 && num !== 1) continue;
        allCards.push({ num, den, id: `${num}/${den}` });
      }
    }

    const els = {
      visual: document.getElementById("fractionVisual"),
      fractionText: document.getElementById("fractionText"),
      bar: document.getElementById("fractionBar"),
      prompt: document.getElementById("promptText"),
      hint: document.getElementById("hintText"),
      form: document.getElementById("answerForm"),
      input: document.getElementById("answerInput"),
      answerDisplay: document.getElementById("answerDisplay"),
      digitKeys: document.getElementById("digitKeys"),
      feedback: document.getElementById("feedback"),
      nextCard: document.getElementById("nextCard"),
      practiceView: document.getElementById("practiceView"),
      allView: document.getElementById("allView"),
      allTable: document.getElementById("allTable"),
      reaction: document.getElementById("correctReaction")
    };

    const saved = JSON.parse(localStorage.getItem("fraction-decimal-practice") || "{}");
    const state = {
      enabledDenoms: [3, 4, 5, 6, 7, 8, 9],
      stats: saved.stats || {},
      correct: saved.correct || 0,
      tries: saved.tries || 0,
      streak: saved.streak || 0,
      mode: "practice",
      queue: [],
      current: null,
      answered: false,
      advanceTimer: null,
      touchStartX: 0,
      touchStartY: 0
    };

    function save() {
      localStorage.setItem("fraction-decimal-practice", JSON.stringify({
        stats: state.stats,
        correct: state.correct,
        tries: state.tries,
        streak: state.streak
      }));
    }

    function gcd(a, b) {
      while (b) {
        const temp = b;
        b = a % b;
        a = temp;
      }
      return a;
    }

    function isTerminating(num, den) {
      const g = gcd(num, den);
      let d = den / g;
      while (d % 2 === 0) d /= 2;
      while (d % 5 === 0) d /= 5;
      return d === 1;
    }

    function recurringInfo(num, den) {
      const seen = new Map();
      let rem = num % den;
      let digits = "";
      let index = 0;
      while (rem && !seen.has(rem)) {
        seen.set(rem, index);
        rem *= 10;
        digits += String(Math.floor(rem / den));
        rem %= den;
        index += 1;
      }
      if (!rem) return { prefix: digits.replace(/0+$/, ""), repeat: "" };
      const start = seen.get(rem);
      return { prefix: digits.slice(0, start), repeat: digits.slice(start) };
    }

    function dottedDigit(digit) {
      return digit + "\u0307";
    }

    function fractionLabel(card) {
      return card.id;
    }

    function decimalLabel(num, den) {
      const value = num / den;
      if (isTerminating(num, den)) {
        return String(value.toFixed(8)).replace(/0+$/, "").replace(/\.$/, "");
      }
      const info = recurringInfo(num, den);
      if (info.repeat.length === 1) return `0.${info.prefix}${dottedDigit(info.repeat)}`;
      return `0.${info.prefix}${dottedDigit(info.repeat[0])}${info.repeat.slice(1, -1)}${dottedDigit(info.repeat.at(-1))}`;
    }

    function plainDecimalLabel(num, den) {
      if (isTerminating(num, den)) return decimalLabel(num, den);
      const value = num / den;
      return `${value.toFixed(3)}...`;
    }

    function normalizeNumber(raw) {
      let text = raw
        .trim()
        .replace(/[０-９．]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
        .replace("。", ".")
        .replace(/,/g, "")
        .replace(/…/g, "...");
      if (text.startsWith("0.")) text = text.slice(2);
      if (text.startsWith(".")) text = text.slice(1);
      return `0.${text}`;
    }

    function hasDottedDigit(text) {
      return /[1-9]\u0307/.test(text);
    }

    function removeDots(text) {
      return text.normalize("NFD").replace(/\u0307/g, "");
    }

    function checkAnswer(raw, card) {
      const normalized = normalizeNumber(raw);
      const plain = removeDots(normalized);
      if (!/^0?(\.\d+)(\.\.\.)?$/.test(plain) && !/^1(\.0+)?$/.test(plain)) {
        return { ok: false, reason: "0. の後ろだけ入れてみてね。例: 375" };
      }

      const numeric = Number(plain.replace(/\.\.\.$/, ""));
      const exact = card.num / card.den;
      if (isTerminating(card.num, card.den)) {
        if (hasDottedDigit(normalized)) {
          return {
            ok: false,
            reason: `これは循環小数ではないよ。${decimalLabel(card.num, card.den)}`
          };
        }
        return {
          ok: Math.abs(numeric - exact) < 0.0000001,
          reason: `ぴったりは ${decimalLabel(card.num, card.den)}`
        };
      }

      if (hasDottedDigit(normalized)) {
        const expected = decimalLabel(card.num, card.den).normalize("NFD");
        return {
          ok: normalized.normalize("NFD") === expected,
          reason: `循環小数は ${decimalLabel(card.num, card.den)}`
        };
      }

      return {
        ok: false,
        reason: `循環小数なので上点つきで入れてね。${decimalLabel(card.num, card.den)}`
      };
    }

    function cardStat(card) {
      return state.stats[card.id] || { right: 0, wrong: 0 };
    }

    function filteredCards() {
      return allCards.filter(card => state.enabledDenoms.includes(card.den));
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function spreadCardsEvenly(cards, previousDen = null) {
      const groups = new Map();
      shuffle(cards).forEach(card => {
        if (!groups.has(card.den)) groups.set(card.den, []);
        groups.get(card.den).push(card);
      });

      const deck = [];
      let lastDen = previousDen;

      while (deck.length < cards.length) {
        const candidates = [...groups.entries()]
          .filter(([den, group]) => group.length && den !== lastDen)
          .sort((a, b) => b[1].length - a[1].length);
        const fallback = [...groups.entries()]
          .filter(([, group]) => group.length)
          .sort((a, b) => b[1].length - a[1].length);
        const [den, group] = (candidates[0] || fallback[0]);
        deck.push(group.pop());
        lastDen = den;
      }

      return deck;
    }

    function buildRound() {
      state.queue = spreadCardsEvenly(filteredCards(), state.current?.den ?? null);
      nextCard();
    }

    function takeNextCard() {
      if (!state.current || !state.queue.length) return state.queue.shift();
      const sameDen = state.current.den;
      if (state.queue[0].den !== sameDen) return state.queue.shift();
      const swapIndex = state.queue.findIndex(card => card.den !== sameDen);
      if (swapIndex < 0) return state.queue.shift();
      const [card] = state.queue.splice(swapIndex, 1);
      return card;
    }

    function polar(cx, cy, r, angle) {
      const rad = (angle - 90) * Math.PI / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }

    function slicePath(start, end, r = 88) {
      const cx = 120;
      const cy = 110;
      const a = polar(cx, cy, r, start);
      const b = polar(cx, cy, r, end);
      const large = end - start > 180 ? 1 : 0;
      return `M ${cx} ${cy} L ${a.x} ${a.y} A ${r} ${r} 0 ${large} 1 ${b.x} ${b.y} Z`;
    }

    function renderCircle(card, size = "large") {
      const stroke = size === "large" ? 3 : 5;
      const parts = [];
      for (let i = 0; i < card.den; i += 1) {
        const active = i < card.num;
        parts.push(`<path d="${slicePath(i * 360 / card.den, (i + 1) * 360 / card.den)}" fill="${active ? "var(--warm)" : "var(--soft-gray)"}" stroke="var(--panel)" stroke-width="${stroke}"></path>`);
      }
      parts.push('<circle cx="120" cy="110" r="88" fill="none" stroke="var(--line)" stroke-width="2"></circle>');
      return parts.join("");
    }

    function renderSevenths(card) {
      const x = 18;
      const y = 62;
      const w = 204;
      const h = 96;
      const cell = w / 7;
      const parts = [`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="var(--soft-gray)" stroke="var(--line)" stroke-width="2"></rect>`];
      for (let i = 0; i < 7; i += 1) {
        parts.push(`<rect x="${x + i * cell}" y="${y}" width="${cell}" height="${h}" fill="${i < card.num ? "var(--warm)" : "transparent"}"></rect>`);
        if (i > 0) parts.push(`<line x1="${x + i * cell}" y1="${y}" x2="${x + i * cell}" y2="${y + h}" stroke="var(--panel)" stroke-width="3"></line>`);
      }
      parts.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="none" stroke="var(--line)" stroke-width="2"></rect>`);
      return parts.join("");
    }

    function renderNinths(card) {
      const x = 54;
      const y = 38;
      const cell = 44;
      const parts = [];
      for (let i = 0; i < 9; i += 1) {
        const col = i % 3;
        const row = Math.floor(i / 3);
        parts.push(`<rect x="${x + col * cell}" y="${y + row * cell}" width="${cell}" height="${cell}" rx="5" fill="${i < card.num ? "var(--warm)" : "var(--soft-gray)"}" stroke="var(--panel)" stroke-width="4"></rect>`);
      }
      parts.push(`<rect x="${x}" y="${y}" width="${cell * 3}" height="${cell * 3}" rx="8" fill="none" stroke="var(--line)" stroke-width="2"></rect>`);
      return parts.join("");
    }

    function visualMarkup(card, size = "large") {
      if (card.den === 7) return renderSevenths(card);
      if (card.den === 9) return renderNinths(card);
      return renderCircle(card, size);
    }

    function renderVisual(card) {
      els.visual.innerHTML = visualMarkup(card);
      els.fractionText.textContent = fractionLabel(card);
      els.bar.style.setProperty("--parts", card.den);
      els.bar.innerHTML = Array.from({ length: card.den }, (_, i) => `<span class="${i < card.num ? "on" : ""}"></span>`).join("");
    }

    function feedbackTextWithDots(text) {
      const escaped = text.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
      return escaped.replace(/([0-9])\u0307/g, '<span class="repeat-digit-answer">$1</span>');
    }

    function setFeedback(kind, text) {
      els.feedback.className = `feedback ${kind || ""}`.trim();
      els.feedback.innerHTML = feedbackTextWithDots(text);
    }

    function renderAnswerInput() {
      els.answerDisplay.innerHTML = feedbackTextWithDots(els.input.value);
    }

    function showCorrectReaction() {
      els.reaction.classList.remove("show");
      void els.reaction.offsetWidth;
      els.reaction.classList.add("show");
    }

    function hideCorrectReaction() {
      els.reaction.classList.remove("show");
    }

    function renderStats() {
    }

    function renderAllTable() {
      els.allTable.innerHTML = allCards
        .filter(card => state.enabledDenoms.includes(card.den))
        .map(card => {
          const stat = cardStat(card);
          const status = stat.right || stat.wrong
            ? `<span class="pill ${stat.wrong > stat.right ? "bad" : "good"}">正${stat.right} / 誤${stat.wrong}</span>`
            : '<span class="pill">未</span>';
          return `<tr><td>${fractionLabel(card)}</td><td>${decimalLabel(card.num, card.den)}</td><td>${status}</td></tr>`;
        })
        .join("");
    }

    function nextCard() {
      if (state.advanceTimer) {
        clearTimeout(state.advanceTimer);
        state.advanceTimer = null;
      }
      if (state.current && !state.answered) {
        setFeedback("bad", "先に答えを入れて「答える」を押してね。");
        return;
      }
      hideCorrectReaction();
      if (!state.queue.length) {
        buildRound();
        return;
      }
      state.current = takeNextCard();
      state.answered = false;
      renderVisual(state.current);
      els.prompt.textContent = `${fractionLabel(state.current)} を小数にすると？`;
      els.hint.textContent = isTerminating(state.current.num, state.current.den)
        ? "0. の後ろを、最後までぴったり入れてね。"
        : "循環するところは、上点つきの数字で入れてね。";
      els.input.value = "";
      renderAnswerInput();
      els.nextCard.disabled = true;
      setFeedback("", "0. の後ろに続く数字を入れてみよう。");
      renderStats();
      els.input.focus();
    }

    function record(card, ok) {
      const stat = cardStat(card);
      if (ok) stat.right += 1;
      else stat.wrong += 1;
      state.stats[card.id] = stat;
      state.tries += 1;
      if (ok) {
        state.correct += 1;
        state.streak += 1;
      } else {
        state.streak = 0;
        let insertAt = Math.min(3, state.queue.length);
        while (insertAt < state.queue.length && state.queue[insertAt - 1]?.den === card.den) {
          insertAt += 1;
        }
        state.queue.splice(insertAt, 0, card);
      }
      save();
      renderStats();
      renderAllTable();
    }

    function submitAnswer(event) {
      event.preventDefault();
      if (!state.current || state.answered) return;
      const result = checkAnswer(els.input.value, state.current);
      state.answered = true;
      els.nextCard.disabled = false;
      record(state.current, result.ok);
      if (result.ok) {
        setFeedback("good", `正解。${fractionLabel(state.current)} = ${decimalLabel(state.current.num, state.current.den)}`);
        showCorrectReaction();
        state.advanceTimer = setTimeout(() => {
          state.advanceTimer = null;
          nextCard();
        }, 1000);
      } else {
        hideCorrectReaction();
        setFeedback("bad", `惜しい。${result.reason}`);
      }
    }

    function appendInput(text) {
      if (text === ".") return;
      const start = els.input.selectionStart ?? els.input.value.length;
      const end = els.input.selectionEnd ?? els.input.value.length;
      els.input.value = els.input.value.slice(0, start) + text + els.input.value.slice(end);
      const caret = start + text.length;
      renderAnswerInput();
      els.input.focus();
      els.input.setSelectionRange(caret, caret);
    }

    function backspaceInput() {
      const start = els.input.selectionStart ?? els.input.value.length;
      const end = els.input.selectionEnd ?? els.input.value.length;
      if (start !== end) {
        els.input.value = els.input.value.slice(0, start) + els.input.value.slice(end);
        renderAnswerInput();
        els.input.setSelectionRange(start, start);
        return;
      }
      const chars = Array.from(els.input.value);
      const before = Array.from(els.input.value.slice(0, start));
      const deleteCount = before.length && before.at(-1) === "\u0307" ? 2 : 1;
      const next = chars.slice(0, Math.max(0, before.length - deleteCount)).join("") + chars.slice(before.length).join("");
      const caret = Math.max(0, start - deleteCount);
      els.input.value = next;
      renderAnswerInput();
      els.input.focus();
      els.input.setSelectionRange(caret, caret);
    }

    function buildKeypads() {
      els.digitKeys.innerHTML = Array.from({ length: 10 }, (_, n) => {
        const repeat = n === 0
          ? '<button class="key dotdigit placeholder" type="button" aria-hidden="true">0</button>'
          : `<button class="key dotdigit" type="button" data-key="${n}\u0307" aria-label="${n} 上点"><span class="repeat-digit">${n}</span></button>`;
        return `
          <div class="digit-stack">
            <button class="key" type="button" data-key="${n}">${n}</button>
            ${repeat}
          </div>
        `;
      }).join("");
    }

    els.form.addEventListener("submit", submitAnswer);
    els.nextCard.addEventListener("click", nextCard);
    document.addEventListener("click", event => {
      const key = event.target.closest("[data-key]");
      const action = event.target.closest("[data-action]");
      if (key) appendInput(key.dataset.key);
      if (action?.dataset.action === "back") backspaceInput();
      if (action?.dataset.action === "clear") {
        els.input.value = "";
        renderAnswerInput();
        els.input.focus();
      }
    });
    document.addEventListener("touchstart", event => {
      if (event.touches.length !== 1) return;
      state.touchStartX = event.touches[0].clientX;
      state.touchStartY = event.touches[0].clientY;
    }, { passive: true });
    document.addEventListener("touchend", event => {
      if (!state.touchStartX && !state.touchStartY) return;
      const touch = event.changedTouches[0];
      const dx = touch.clientX - state.touchStartX;
      const dy = touch.clientY - state.touchStartY;
      state.touchStartX = 0;
      state.touchStartY = 0;
      if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
      if (dx < 0) nextCard();
    }, { passive: true });

    buildKeypads();
    renderAllTable();
    els.input.value = "";
    renderAnswerInput();
    buildRound();
  </script>
</body>
</html>
