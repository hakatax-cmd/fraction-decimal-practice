<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>分数から小数 練習</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --ink: #202633;
      --muted: #667085;
      --panel: #ffffff;
      --line: #d9dee8;
      --primary: #276ef1;
      --primary-dark: #1857c6;
      --good: #14845d;
      --bad: #c24134;
      --warm: #f6b44b;
      --cool: #58b3c9;
      --soft-green: #ddf3e9;
      --soft-red: #ffe2dd;
      --soft-gray: #eef1f6;
      --shadow: 0 12px 28px rgba(30, 36, 48, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #eef5ff 0, transparent 32rem), var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      overflow-x: hidden;
      overscroll-behavior-y: contain;
    }

    main {
      width: min(1120px, calc(100% - 24px));
      margin: 0 auto;
      padding: 10px 0 28px;
    }

    header {
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.25rem, 1rem + 0.8vw, 1.75rem);
      font-weight: 700;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      min-height: 40px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      touch-action: manipulation;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: #aab4c4;
    }

    button:active {
      transform: translateY(0);
    }

    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    button.primary:hover {
      background: var(--primary-dark);
    }

    button.ghost {
      background: transparent;
    }

    button[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: white;
    }

    .app {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .practice {
      padding: 16px;
    }

    body.home header {
      display: none;
    }

    body.home main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px 0;
    }

    body.home .practice {
      width: 100%;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .start-screen {
      position: relative;
      min-height: min(78vh, 620px);
      display: grid;
      place-items: center;
      text-align: center;
      overflow: hidden;
      padding: 32px 12px;
    }

    .start-screen::before {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background:
        repeating-conic-gradient(from -12deg, rgba(39, 110, 241, 0.12) 0deg 8deg, transparent 8deg 18deg);
      filter: blur(0.2px);
      transform: rotate(-8deg);
      pointer-events: none;
    }

    .start-screen::after {
      content: "1/4  3/8  1/7  5/6";
      position: absolute;
      left: 50%;
      bottom: 10%;
      color: rgba(32, 38, 51, 0.12);
      font-size: clamp(1.6rem, 0.9rem + 3vw, 3.8rem);
      font-weight: 900;
      white-space: nowrap;
      transform: translateX(-50%) rotate(-5deg);
      pointer-events: none;
    }

    .start-inner {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 18px;
      justify-items: center;
    }

    .home-title {
      margin: 0;
      font-size: clamp(3.2rem, 2.2rem + 5vw, 7rem);
      line-height: 0.95;
      font-weight: 1000;
      color: var(--ink);
      max-width: 7em;
      text-shadow:
        0 5px 0 #ffffff,
        0 10px 0 rgba(246, 180, 75, 0.75);
    }

    .home-subtitle {
      margin: 0;
      padding: 8px 16px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: #fff3bf;
      color: var(--ink);
      font-size: clamp(1.15rem, 0.95rem + 1vw, 1.8rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      box-shadow: 5px 5px 0 var(--ink);
    }

    .start-button {
      min-width: min(280px, 82vw);
      min-height: 70px;
      margin-top: 12px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 6px 6px 0 var(--ink);
      font-size: 1.55rem;
      font-weight: 900;
    }

    .visual-zone {
      display: grid;
      grid-template-columns: minmax(180px, 290px) minmax(0, 1fr);
      gap: 18px;
      align-items: center;
    }

    .picture-wrap {
      display: grid;
      justify-items: center;
      align-content: center;
      min-height: 250px;
    }

    .fraction-visual {
      width: min(270px, 100%);
      height: auto;
      display: block;
    }

    .question h2 {
      margin: 0 0 8px;
      font-size: clamp(1.25rem, 1.04rem + 0.75vw, 1.8rem);
      font-weight: 700;
    }

    .challenge-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      z-index: 12;
      margin: 0;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 6px 18px rgba(30, 36, 48, 0.12);
    }

    .question-number {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .hint {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.95rem;
    }

    .answer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      margin-bottom: 22px;
    }

    .answer-box {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .answer-prefix {
      display: grid;
      place-items: center;
      align-self: stretch;
      min-width: 74px;
      padding: 0 14px;
      background: var(--soft-gray);
      border-right: 1px solid var(--line);
      color: var(--muted);
      font-size: 1.85rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .answer-entry {
      position: relative;
      min-width: 0;
    }

    .answer-row input {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      padding: 12px 14px;
      font-size: 1.9rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: transparent;
      caret-color: transparent;
    }

    .answer-display {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 12px 14px;
      pointer-events: none;
      font-size: 1.9rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .answer-row input:focus,
    .answer-box:focus-within {
      outline: 3px solid rgba(39, 110, 241, 0.18);
      border-color: var(--primary);
    }

    .keypad {
      display: grid;
      gap: 14px;
      margin: 10px 0 14px;
    }

    .digit-pairs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .key {
      min-width: 0;
      min-height: 54px;
      padding: 10px 4px;
      border-width: 2px;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 3px 0 var(--line);
      font-size: 1.25rem;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .key.dotdigit {
      min-height: 54px;
      padding: 10px 4px;
      background: #eef5ff;
      border-color: #b8cdf8;
      color: var(--primary);
    }

    .key.placeholder {
      visibility: hidden;
      pointer-events: none;
    }

    .repeat-digit {
      position: relative;
      display: inline-block;
      min-width: 0.8em;
      padding-top: 0;
      line-height: inherit;
      vertical-align: baseline;
    }

    .repeat-digit::before {
      content: "";
      position: absolute;
      top: -0.2em;
      left: 50%;
      width: 0.18em;
      height: 0.18em;
      border-radius: 50%;
      background: var(--primary);
      transform: translateX(-50%);
    }

    .key-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .feedback {
      min-height: 50px;
      border-radius: 8px;
      padding: 10px 12px;
      background: transparent;
      color: var(--muted);
      line-height: 1.5;
      white-space: pre-line;
      visibility: hidden;
    }

    .feedback.good {
      color: var(--good);
      background: var(--soft-green);
      visibility: visible;
    }

    .feedback.bad {
      color: var(--bad);
      background: var(--soft-red);
      visibility: visible;
    }

    .leaderboard {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 10px;
    }

    .leaderboard h3 {
      margin: 0 0 8px;
      font-size: 1rem;
    }

    .leaderboard ol {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 2.5em minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 7px 8px;
      border-radius: 8px;
      background: #f7f8fb;
      font-variant-numeric: tabular-nums;
      font-size: 0.92rem;
    }

    .rank-row.current {
      outline: 2px solid #f6b44b;
      background: #fff3bf;
    }

    .rank-date {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .feedback .repeat-digit-answer,
    .answer-display .repeat-digit-answer {
      position: relative;
      display: inline-block;
      min-width: 0.72em;
      padding-top: 0;
      line-height: inherit;
      text-align: center;
      vertical-align: baseline;
    }

    .feedback .repeat-digit-answer::before,
    .answer-display .repeat-digit-answer::before {
      content: "";
      position: absolute;
      top: -0.2em;
      left: 50%;
      width: 0.18em;
      height: 0.18em;
      border-radius: 50%;
      background: currentColor;
      transform: translateX(-50%);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
      transform: none;
    }

    .reaction {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      opacity: 0;
      z-index: 20;
    }

    .reaction.show {
      opacity: 1;
    }

    .reaction-content {
      display: grid;
      justify-items: center;
      gap: 16px;
    }

    .big-circle {
      width: min(280px, 64vw);
      aspect-ratio: 1;
      border: 18px solid #e33a2f;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.72);
    }

    .big-x {
      display: none;
      color: #e33a2f;
      font-size: min(220px, 45vw);
      font-weight: 1000;
      line-height: 0.9;
      text-shadow: 0 8px 0 rgba(255, 255, 255, 0.9);
    }

    .answer-flash {
      display: none;
      padding: 10px 18px;
      border: 4px solid var(--bad);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      font-size: clamp(2.2rem, 10vw, 5rem);
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .reaction.wrong .big-circle {
      display: none;
    }

    .reaction.wrong .big-x,
    .reaction.wrong .answer-flash {
      display: block;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    label {
      color: var(--muted);
      line-height: 1.45;
    }

    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      background: var(--panel);
      color: var(--ink);
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    .table th,
    .table td {
      text-align: left;
      padding: 9px 4px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    .table th:last-child,
    .table td:last-child {
      text-align: right;
    }

    .table th {
      color: var(--muted);
      font-weight: 600;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 0.86rem;
      background: var(--soft-gray);
      color: var(--muted);
    }

    .pill.good {
      background: var(--soft-green);
      color: var(--good);
    }

    .pill.bad {
      background: var(--soft-red);
      color: var(--bad);
    }

    .mini-list {
      display: grid;
      gap: 8px;
    }

    .mini-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }

    .mini-card:last-child {
      border-bottom: 0;
    }

    .tiny-visual {
      width: 36px;
      height: 36px;
    }

    @media (max-width: 900px) {
      .app,
      .visual-zone {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      main {
        width: min(100% - 18px, 1120px);
        padding-top: 14px;
      }

      .practice {
        padding: 12px;
      }

      .start-screen {
        min-height: 72vh;
        padding: 28px 8px;
      }

      .home-title {
        font-size: clamp(2.8rem, 15vw, 4.9rem);
      }

    }
  </style>
</head>
<body class="home">
  <main>
    <header>
      <h1>分数から小数</h1>
    </header>

    <section class="app">
      <div class="panel practice">
        <div id="practiceView">
          <div id="startScreen" class="start-screen">
            <div class="start-inner">
              <h2 class="home-title">分数から小数</h2>
              <p class="home-subtitle">20問タイムトライアル</p>
              <button id="startButton" class="primary start-button" type="button">はじめる</button>
            </div>
          </div>
          <div id="challengeArea" class="visual-zone" hidden>
            <div class="picture-wrap">
              <svg id="fractionVisual" class="fraction-visual" viewBox="0 0 240 220" role="img" aria-label="分数の絵"></svg>
            </div>
            <div class="question">
              <h2 id="promptText">小数にすると？</h2>
              <div class="challenge-meta" aria-live="polite">
                <span id="questionNumber" class="question-number"></span>
                <span id="elapsedTime">00:00.0</span>
              </div>
              <form id="answerForm">
                <div class="answer-row">
                  <div class="answer-box">
                    <span class="answer-prefix" aria-hidden="true">0.</span>
                    <div class="answer-entry">
                      <input id="answerInput" inputmode="none" autocomplete="off" placeholder="" aria-label="0. の後ろの数字" readonly>
                      <div id="answerDisplay" class="answer-display" aria-hidden="true"></div>
                    </div>
                  </div>
                </div>
              </form>

              <div class="keypad" aria-label="タッチ入力">
                <div id="digitKeys" class="digit-pairs"></div>
                <div class="key-tools">
                  <button class="key" type="button" data-action="back">1つ消す</button>
                  <button class="key" type="button" data-action="clear">全部消す</button>
                </div>
              </div>

              <div id="feedback" class="feedback" aria-live="polite"></div>
              <div id="leaderboard" class="leaderboard" hidden></div>
              <div class="actions">
                <button id="nextCard" type="button">次へ</button>
              </div>
            </div>
          </div>
        </div>

        <div id="allView" hidden>
          <table class="table">
            <thead>
              <tr>
                <th>分数</th>
                <th>小数</th>
                <th>状態</th>
              </tr>
            </thead>
            <tbody id="allTable"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="correctReaction" class="reaction" aria-hidden="true">
    <div class="reaction-content">
      <div class="big-circle"></div>
      <div class="big-x">×</div>
      <div id="answerFlash" class="answer-flash"></div>
    </div>
  </div>

  <script>
    const allCards = [];
    for (let den = 3; den <= 9; den += 1) {
      for (let num = 1; num < den; num += 1) {
        if (den === 7 && num !== 1) continue;
        allCards.push({ num, den, id: `${num}/${den}` });
      }
    }

    const els = {
      visual: document.getElementById("fractionVisual"),
      prompt: document.getElementById("promptText"),
      form: document.getElementById("answerForm"),
      input: document.getElementById("answerInput"),
      answerDisplay: document.getElementById("answerDisplay"),
      questionNumber: document.getElementById("questionNumber"),
      elapsedTime: document.getElementById("elapsedTime"),
      startScreen: document.getElementById("startScreen"),
      challengeArea: document.getElementById("challengeArea"),
      startButton: document.getElementById("startButton"),
      digitKeys: document.getElementById("digitKeys"),
      feedback: document.getElementById("feedback"),
      leaderboard: document.getElementById("leaderboard"),
      nextCard: document.getElementById("nextCard"),
      practiceView: document.getElementById("practiceView"),
      allView: document.getElementById("allView"),
      allTable: document.getElementById("allTable"),
      reaction: document.getElementById("correctReaction"),
      answerFlash: document.getElementById("answerFlash")
    };

    const saved = JSON.parse(localStorage.getItem("fraction-decimal-practice") || "{}");
    const state = {
      enabledDenoms: [3, 4, 5, 6, 7, 8, 9],
      stats: saved.stats || {},
      correct: saved.correct || 0,
      tries: saved.tries || 0,
      streak: saved.streak || 0,
      mode: "practice",
      queue: [],
      current: null,
      answered: false,
      challengeTarget: 20,
      sessionCorrect: 0,
      sessionQuestion: 0,
      sessionMistakes: 0,
      cardMistakes: 0,
      records: Array.isArray(saved.records) ? saved.records : [],
      startedAt: null,
      finishedElapsedMs: null,
      finished: false,
      timerInterval: null,
      advanceTimer: null,
      touchStartX: 0,
      touchStartY: 0
    };

    function save() {
      localStorage.setItem("fraction-decimal-practice", JSON.stringify({
        stats: state.stats,
        correct: state.correct,
        tries: state.tries,
        streak: state.streak,
        records: state.records
      }));
    }

    function gcd(a, b) {
      while (b) {
        const temp = b;
        b = a % b;
        a = temp;
      }
      return a;
    }

    function isTerminating(num, den) {
      const g = gcd(num, den);
      let d = den / g;
      while (d % 2 === 0) d /= 2;
      while (d % 5 === 0) d /= 5;
      return d === 1;
    }

    function recurringInfo(num, den) {
      const seen = new Map();
      let rem = num % den;
      let digits = "";
      let index = 0;
      while (rem && !seen.has(rem)) {
        seen.set(rem, index);
        rem *= 10;
        digits += String(Math.floor(rem / den));
        rem %= den;
        index += 1;
      }
      if (!rem) return { prefix: digits.replace(/0+$/, ""), repeat: "" };
      const start = seen.get(rem);
      return { prefix: digits.slice(0, start), repeat: digits.slice(start) };
    }

    function dottedDigit(digit) {
      return digit + "\u0307";
    }

    function fractionLabel(card) {
      return card.id;
    }

    function decimalLabel(num, den) {
      const value = num / den;
      if (isTerminating(num, den)) {
        return String(value.toFixed(8)).replace(/0+$/, "").replace(/\.$/, "");
      }
      const info = recurringInfo(num, den);
      if (info.repeat.length === 1) return `0.${info.prefix}${dottedDigit(info.repeat)}`;
      return `0.${info.prefix}${dottedDigit(info.repeat[0])}${info.repeat.slice(1, -1)}${dottedDigit(info.repeat.at(-1))}`;
    }

    function plainDecimalLabel(num, den) {
      if (isTerminating(num, den)) return decimalLabel(num, den);
      const value = num / den;
      return `${value.toFixed(3)}...`;
    }

    function normalizeNumber(raw) {
      let text = raw
        .trim()
        .replace(/[０-９．]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
        .replace("。", ".")
        .replace(/,/g, "")
        .replace(/…/g, "...");
      if (text.startsWith("0.")) text = text.slice(2);
      if (text.startsWith(".")) text = text.slice(1);
      return `0.${text}`;
    }

    function hasDottedDigit(text) {
      return /[1-9]\u0307/.test(text);
    }

    function removeDots(text) {
      return text.normalize("NFD").replace(/\u0307/g, "");
    }

    function checkAnswer(raw, card) {
      const normalized = normalizeNumber(raw);
      const plain = removeDots(normalized);
      if (!/^0?(\.\d+)(\.\.\.)?$/.test(plain) && !/^1(\.0+)?$/.test(plain)) {
        return { ok: false, reason: "0. の後ろだけ入れてみてね。例: 375" };
      }

      const numeric = Number(plain.replace(/\.\.\.$/, ""));
      const exact = card.num / card.den;
      if (isTerminating(card.num, card.den)) {
        if (hasDottedDigit(normalized)) {
          return {
            ok: false,
            reason: `これは循環小数ではないよ。${decimalLabel(card.num, card.den)}`
          };
        }
        return {
          ok: Math.abs(numeric - exact) < 0.0000001,
          reason: `ぴったりは ${decimalLabel(card.num, card.den)}`
        };
      }

      if (hasDottedDigit(normalized)) {
        const expected = decimalLabel(card.num, card.den).normalize("NFD");
        return {
          ok: normalized.normalize("NFD") === expected,
          reason: `循環小数は ${decimalLabel(card.num, card.den)}`
        };
      }

      return {
        ok: false,
        reason: `循環小数なので上点つきで入れてね。${decimalLabel(card.num, card.den)}`
      };
    }

    function answerTail(card) {
      return decimalLabel(card.num, card.den).normalize("NFD").replace(/^0\./, "");
    }

    function answerTokens(text) {
      const chars = Array.from(text.normalize("NFD"));
      const tokens = [];
      for (let i = 0; i < chars.length; i += 1) {
        if (chars[i + 1] === "\u0307") {
          tokens.push(chars[i] + chars[i + 1]);
          i += 1;
        } else {
          tokens.push(chars[i]);
        }
      }
      return tokens;
    }

    function liveAnswerState(raw, card) {
      const input = answerTokens(raw);
      const expected = answerTokens(answerTail(card));
      const matches = input.every((token, index) => token === expected[index]);
      if (!matches) return "wrong";
      if (input.length === expected.length) return "complete";
      return "prefix";
    }

    function cardStat(card) {
      return state.stats[card.id] || { right: 0, wrong: 0 };
    }

    function filteredCards() {
      return allCards.filter(card => state.enabledDenoms.includes(card.den));
    }

    const denominatorWeights = new Map([
      [4, 3],
      [6, 2],
      [7, 9],
      [8, 2],
      [9, 1]
    ]);

    function weightedCards() {
      const cards = [];
      filteredCards().forEach(card => {
        const weight = denominatorWeights.get(card.den) || 1;
        for (let i = 0; i < weight; i += 1) cards.push(card);
      });
      return cards;
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function spreadCardsEvenly(cards, previousDen = null) {
      const groups = new Map();
      shuffle(cards).forEach(card => {
        if (!groups.has(card.den)) groups.set(card.den, []);
        groups.get(card.den).push(card);
      });

      const deck = [];
      let lastDen = previousDen;

      while (deck.length < cards.length) {
        const candidates = [...groups.entries()]
          .filter(([den, group]) => group.length && den !== lastDen)
          .sort((a, b) => b[1].length - a[1].length);
        const fallback = [...groups.entries()]
          .filter(([, group]) => group.length)
          .sort((a, b) => b[1].length - a[1].length);
        const [den, group] = (candidates[0] || fallback[0]);
        deck.push(group.pop());
        lastDen = den;
      }

      return deck;
    }

    function buildRound() {
      state.queue = spreadCardsEvenly(weightedCards(), state.current?.den ?? null);
      nextCard();
    }

    function startChallenge() {
      state.queue = [];
      state.current = null;
      state.answered = false;
      state.sessionCorrect = 0;
      state.sessionQuestion = 0;
      state.sessionMistakes = 0;
      state.cardMistakes = 0;
      state.startedAt = null;
      state.finishedElapsedMs = null;
      state.finished = false;
      document.body.classList.remove("home");
      els.startScreen.hidden = true;
      els.challengeArea.hidden = false;
      els.leaderboard.hidden = true;
      els.leaderboard.innerHTML = "";
      hideCorrectReaction();
      setPracticeDisabled(false);
      renderChallenge();
      buildRound();
    }

    function takeNextCard() {
      if (!state.current || !state.queue.length) return state.queue.shift();
      const sameDen = state.current.den;
      if (state.queue[0].den !== sameDen) return state.queue.shift();
      const swapIndex = state.queue.findIndex(card => card.den !== sameDen);
      if (swapIndex < 0) return state.queue.shift();
      const [card] = state.queue.splice(swapIndex, 1);
      return card;
    }

    function polar(cx, cy, r, angle) {
      const rad = (angle - 90) * Math.PI / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }

    function slicePath(start, end, r = 88) {
      const cx = 120;
      const cy = 110;
      const a = polar(cx, cy, r, start);
      const b = polar(cx, cy, r, end);
      const large = end - start > 180 ? 1 : 0;
      return `M ${cx} ${cy} L ${a.x} ${a.y} A ${r} ${r} 0 ${large} 1 ${b.x} ${b.y} Z`;
    }

    function renderCircle(card, size = "large") {
      const stroke = size === "large" ? 3 : 5;
      const parts = [];
      for (let i = 0; i < card.den; i += 1) {
        const active = i < card.num;
        parts.push(`<path d="${slicePath(i * 360 / card.den, (i + 1) * 360 / card.den)}" fill="${active ? "var(--warm)" : "var(--soft-gray)"}" stroke="var(--panel)" stroke-width="${stroke}"></path>`);
      }
      parts.push('<circle cx="120" cy="110" r="88" fill="none" stroke="var(--line)" stroke-width="2"></circle>');
      return parts.join("");
    }

    function renderSevenths(card) {
      const x = 18;
      const y = 62;
      const w = 204;
      const h = 96;
      const cell = w / 7;
      const parts = [`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="var(--soft-gray)" stroke="var(--line)" stroke-width="2"></rect>`];
      for (let i = 0; i < 7; i += 1) {
        parts.push(`<rect x="${x + i * cell}" y="${y}" width="${cell}" height="${h}" fill="${i < card.num ? "var(--warm)" : "transparent"}"></rect>`);
        if (i > 0) parts.push(`<line x1="${x + i * cell}" y1="${y}" x2="${x + i * cell}" y2="${y + h}" stroke="var(--panel)" stroke-width="3"></line>`);
      }
      parts.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="none" stroke="var(--line)" stroke-width="2"></rect>`);
      return parts.join("");
    }

    function renderNinths(card) {
      const x = 54;
      const y = 38;
      const cell = 44;
      const parts = [];
      for (let i = 0; i < 9; i += 1) {
        const col = i % 3;
        const row = Math.floor(i / 3);
        parts.push(`<rect x="${x + col * cell}" y="${y + row * cell}" width="${cell}" height="${cell}" rx="5" fill="${i < card.num ? "var(--warm)" : "var(--soft-gray)"}" stroke="var(--panel)" stroke-width="4"></rect>`);
      }
      parts.push(`<rect x="${x}" y="${y}" width="${cell * 3}" height="${cell * 3}" rx="8" fill="none" stroke="var(--line)" stroke-width="2"></rect>`);
      return parts.join("");
    }

    function visualMarkup(card, size = "large") {
      if (card.den === 7) return renderSevenths(card);
      if (card.den === 9) return renderNinths(card);
      return renderCircle(card, size);
    }

    function renderVisual(card) {
      els.visual.innerHTML = visualMarkup(card);
    }

    function feedbackTextWithDots(text) {
      const escaped = text.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
      return escaped.replace(/([0-9])\u0307/g, '<span class="repeat-digit-answer">$1</span>');
    }

    function setFeedback(kind, text) {
      els.feedback.className = `feedback ${kind || ""}`.trim();
      els.feedback.innerHTML = feedbackTextWithDots(text);
    }

    function renderAnswerInput() {
      els.answerDisplay.innerHTML = feedbackTextWithDots(els.input.value);
    }

    function showCorrectReaction() {
      els.answerFlash.innerHTML = "";
      els.reaction.classList.remove("show", "wrong");
      void els.reaction.offsetWidth;
      els.reaction.classList.add("show");
    }

    function showWrongReaction() {
      els.answerFlash.innerHTML = feedbackTextWithDots(decimalLabel(state.current.num, state.current.den));
      els.reaction.classList.remove("show");
      els.reaction.classList.add("wrong");
      void els.reaction.offsetWidth;
      els.reaction.classList.add("show");
    }

    function hideCorrectReaction() {
      els.reaction.classList.remove("show", "wrong");
      els.answerFlash.innerHTML = "";
    }

    function renderStats() {
    }

    function formatElapsedMs(elapsedMs) {
      const totalTenths = Math.floor(Math.max(0, elapsedMs) / 100);
      const minutes = String(Math.floor(totalTenths / 600)).padStart(2, "0");
      const seconds = String(Math.floor(totalTenths / 10) % 60).padStart(2, "0");
      const tenths = totalTenths % 10;
      return `${minutes}:${seconds}.${tenths}`;
    }

    function elapsedMs() {
      if (state.finishedElapsedMs !== null) return state.finishedElapsedMs;
      if (!state.startedAt) return 0;
      return Date.now() - state.startedAt;
    }

    function formatClearedAt(date) {
      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function topRecords(records) {
      return [...records]
        .sort((a, b) => a.elapsedMs - b.elapsedMs || a.mistakes - b.mistakes || new Date(b.endedAt) - new Date(a.endedAt))
        .slice(0, 10);
    }

    function renderLeaderboard(currentRecord) {
      const records = topRecords(state.records);
      if (!records.length) {
        els.leaderboard.hidden = true;
        els.leaderboard.innerHTML = "";
        return;
      }
      els.leaderboard.hidden = false;
      els.leaderboard.innerHTML = `
        <h3>タイム上位10位</h3>
        <ol>
          ${records.map((record, index) => {
            const isCurrent = currentRecord && record.endedAt === currentRecord.endedAt;
            return `
              <li class="rank-row ${isCurrent ? "current" : ""}">
                <span>${index + 1}位</span>
                <span class="rank-date">${formatClearedAt(new Date(record.endedAt))}</span>
                <span>${formatElapsedMs(record.elapsedMs)}</span>
              </li>
            `;
          }).join("")}
        </ol>
      `;
    }

    function renderChallenge() {
      els.questionNumber.textContent = state.sessionQuestion ? `${state.sessionQuestion}問目` : "";
      els.elapsedTime.textContent = formatElapsedMs(elapsedMs());
    }

    function startChallengeTimer() {
      if (state.startedAt) return;
      state.startedAt = Date.now();
      renderChallenge();
      state.timerInterval = setInterval(renderChallenge, 100);
    }

    function stopChallengeTimer() {
      if (!state.timerInterval) return;
      clearInterval(state.timerInterval);
      state.timerInterval = null;
      renderChallenge();
    }

    function setPracticeDisabled(disabled) {
      els.nextCard.disabled = disabled;
      document.querySelectorAll("[data-key], [data-action]").forEach(button => {
        button.disabled = disabled;
      });
    }

    function finishChallenge() {
      state.finished = true;
      const clearedAt = new Date();
      state.finishedElapsedMs = state.startedAt ? clearedAt.getTime() - state.startedAt : 0;
      const currentRecord = {
        endedAt: clearedAt.toISOString(),
        elapsedMs: state.finishedElapsedMs,
        mistakes: state.sessionMistakes
      };
      state.records = topRecords([...state.records, currentRecord]);
      if (state.advanceTimer) {
        clearTimeout(state.advanceTimer);
        state.advanceTimer = null;
      }
      stopChallengeTimer();
      setPracticeDisabled(true);
      els.prompt.textContent = "結果";
      setFeedback(
        "good",
        `時刻 ${formatClearedAt(clearedAt)}\nタイム ${formatElapsedMs(state.finishedElapsedMs)}\nミス ${state.sessionMistakes}`
      );
      renderLeaderboard(currentRecord);
      save();
      setTimeout(hideCorrectReaction, 1000);
    }

    function renderAllTable() {
      els.allTable.innerHTML = allCards
        .filter(card => state.enabledDenoms.includes(card.den))
        .map(card => {
          const stat = cardStat(card);
          const status = stat.right || stat.wrong
            ? `<span class="pill ${stat.wrong > stat.right ? "bad" : "good"}">正${stat.right} / 誤${stat.wrong}</span>`
            : '<span class="pill">未</span>';
          return `<tr><td>${fractionLabel(card)}</td><td>${decimalLabel(card.num, card.den)}</td><td>${status}</td></tr>`;
        })
        .join("");
    }

    function nextCard() {
      if (state.finished) return;
      if (state.advanceTimer) {
        clearTimeout(state.advanceTimer);
        state.advanceTimer = null;
      }
      if (state.current && !state.answered) {
        setFeedback("bad", "まだ正解していないよ。最後まで入れてね。");
        return;
      }
      hideCorrectReaction();
      if (!state.queue.length) {
        buildRound();
        return;
      }
      state.current = takeNextCard();
      state.answered = false;
      state.cardMistakes = 0;
      state.sessionQuestion += 1;
      startChallengeTimer();
      renderVisual(state.current);
      els.prompt.textContent = `${fractionLabel(state.current)} を小数にすると？`;
      els.input.value = "";
      renderAnswerInput();
      els.nextCard.disabled = true;
      setFeedback("", "");
      renderStats();
      els.input.focus();
    }

    function record(card, ok) {
      const stat = cardStat(card);
      if (ok) stat.right += 1;
      else stat.wrong += 1;
      state.stats[card.id] = stat;
      state.tries += 1;
      if (ok) {
        state.correct += 1;
        state.streak += 1;
        state.sessionCorrect += 1;
      } else {
        state.streak = 0;
        state.sessionMistakes += 1;
      }
      save();
      renderChallenge();
      renderAllTable();
    }

    function recordMistake(card) {
      const stat = cardStat(card);
      stat.wrong += 1;
      state.stats[card.id] = stat;
      state.tries += 1;
      state.streak = 0;
      state.sessionMistakes += 1;
      state.cardMistakes += 1;
      save();
      renderChallenge();
      renderAllTable();
    }

    function completeCurrentAnswer() {
      state.answered = true;
      els.nextCard.disabled = false;
      record(state.current, true);
      setFeedback("good", `正解。${fractionLabel(state.current)} = ${decimalLabel(state.current.num, state.current.den)}`);
      showCorrectReaction();
      if (state.sessionCorrect >= state.challengeTarget) {
        finishChallenge();
        return;
      }
      state.advanceTimer = setTimeout(() => {
        state.advanceTimer = null;
        nextCard();
      }, 600);
    }

    function missCurrentInput(previousValue, previousCaret) {
      els.input.value = previousValue;
      renderAnswerInput();
      els.input.focus();
      els.input.setSelectionRange(previousCaret, previousCaret);
      recordMistake(state.current);
      if (state.cardMistakes >= 3) {
        state.answered = true;
        els.nextCard.disabled = false;
        setFeedback("bad", `3回ミス。答えは ${decimalLabel(state.current.num, state.current.den)}`);
        showWrongReaction();
        state.advanceTimer = setTimeout(() => {
          state.advanceTimer = null;
          nextCard();
        }, 1200);
        return;
      }
      hideCorrectReaction();
      setFeedback("bad", "本当にそれでいい？ 1文字戻したよ。");
    }

    function evaluateLiveAnswer(previousValue, previousCaret) {
      if (state.finished || !state.current || state.answered) return;
      if (!els.input.value) {
        setFeedback("", "");
        return;
      }
      const status = liveAnswerState(els.input.value, state.current);
      if (status === "wrong") {
        missCurrentInput(previousValue, previousCaret);
        return;
      }
      if (status === "complete") {
        completeCurrentAnswer();
        return;
      }
      setFeedback("", "");
    }

    function submitAnswer(event) {
      event.preventDefault();
    }

    function appendInput(text) {
      if (state.finished || state.answered) return;
      if (text === ".") return;
      const start = els.input.selectionStart ?? els.input.value.length;
      const end = els.input.selectionEnd ?? els.input.value.length;
      const previousValue = els.input.value;
      const previousCaret = start;
      els.input.value = els.input.value.slice(0, start) + text + els.input.value.slice(end);
      const caret = start + text.length;
      renderAnswerInput();
      els.input.focus();
      els.input.setSelectionRange(caret, caret);
      evaluateLiveAnswer(previousValue, previousCaret);
    }

    function backspaceInput() {
      if (state.finished || state.answered) return;
      const start = els.input.selectionStart ?? els.input.value.length;
      const end = els.input.selectionEnd ?? els.input.value.length;
      if (start !== end) {
        els.input.value = els.input.value.slice(0, start) + els.input.value.slice(end);
        renderAnswerInput();
        setFeedback("", "");
        els.input.setSelectionRange(start, start);
        return;
      }
      const chars = Array.from(els.input.value);
      const before = Array.from(els.input.value.slice(0, start));
      const deleteCount = before.length && before.at(-1) === "\u0307" ? 2 : 1;
      const next = chars.slice(0, Math.max(0, before.length - deleteCount)).join("") + chars.slice(before.length).join("");
      const caret = Math.max(0, start - deleteCount);
      els.input.value = next;
      renderAnswerInput();
      setFeedback("", "");
      els.input.focus();
      els.input.setSelectionRange(caret, caret);
    }

    function buildKeypads() {
      const rows = [
        { dotted: false, numbers: [0, 1, 2, 3, 4] },
        { dotted: false, numbers: [5, 6, 7, 8, 9] },
        { dotted: true, numbers: [0, 1, 2, 3, 4] },
        { dotted: true, numbers: [5, 6, 7, 8, 9] }
      ];
      els.digitKeys.innerHTML = rows.map(row => row.numbers.map(n => {
        if (!row.dotted) {
          return `<button class="key" type="button" data-key="${n}">${n}</button>`;
        }
        return `<button class="key dotdigit" type="button" data-key="${n}\u0307" aria-label="${n} 上点"><span class="repeat-digit">${n}</span></button>`;
      }).join("")).join("");
    }

    els.form.addEventListener("submit", submitAnswer);
    els.startButton.addEventListener("click", startChallenge);
    els.nextCard.addEventListener("click", nextCard);
    document.addEventListener("click", event => {
      if (state.finished) return;
      const key = event.target.closest("[data-key]");
      const action = event.target.closest("[data-action]");
      if (key) appendInput(key.dataset.key);
      if (action?.dataset.action === "back") backspaceInput();
      if (action?.dataset.action === "clear") {
        if (state.finished || state.answered) return;
        els.input.value = "";
        renderAnswerInput();
        setFeedback("", "");
        els.input.focus();
      }
    });
    document.addEventListener("touchstart", event => {
      if (event.touches.length !== 1) return;
      state.touchStartX = event.touches[0].clientX;
      state.touchStartY = event.touches[0].clientY;
    }, { passive: true });
    document.addEventListener("touchend", event => {
      if (!state.touchStartX && !state.touchStartY) return;
      const touch = event.changedTouches[0];
      const dx = touch.clientX - state.touchStartX;
      const dy = touch.clientY - state.touchStartY;
      state.touchStartX = 0;
      state.touchStartY = 0;
      if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
      if (dx < 0) nextCard();
    }, { passive: true });

    buildKeypads();
    renderAllTable();
    els.input.value = "";
    renderAnswerInput();
    renderChallenge();
  </script>
</body>
</html>
